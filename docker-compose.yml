services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-carwash}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      MYSQL_ROOT_HOST: "%"
      DB_NAME: ${DB_NAME:-carwash}
      DB_USER: ${DB_USER:-carwash}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-me}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-False}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-False}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DB_NAME: ${DB_NAME:-carwash}
      DB_USER: ${DB_USER:-carwash}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_HOST: db
      DB_PORT: "3306"
      PLATE_AI_SERVICE_URL: http://plate-ai:8765
      PLATE_AI_TIMEOUT_SECONDS: ${PLATE_AI_TIMEOUT_SECONDS:-5}
      IRANPAYAMAK_BASE_URL: ${IRANPAYAMAK_BASE_URL:-https://api.iranpayamak.com}
      IRANPAYAMAK_LINE_NUMBER: ${IRANPAYAMAK_LINE_NUMBER:-}
      IRANPAYAMAK_API_KEY: ${IRANPAYAMAK_API_KEY:-}
      SMS_PRICE_PER_SEGMENT: ${SMS_PRICE_PER_SEGMENT:-500}
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
      TZ: ${TZ:-Asia/Tehran}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/', timeout=5).read()\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  plate-ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-Asia/Tehran}
      PLATE_AI_PORT: ${PLATE_AI_PORT:-8765}
      PLATE_AI_IMGSZ: ${PLATE_AI_IMGSZ:-640}
      PLATE_AI_THRESHOLD: ${PLATE_AI_THRESHOLD:-0.45}
      PLATE_AI_MIN_BOX_AREA: ${PLATE_AI_MIN_BOX_AREA:-300}
      PLATE_AI_BATCH_SIZE: ${PLATE_AI_BATCH_SIZE:-8}
      PLATE_AI_BATCH_WAIT_MS: ${PLATE_AI_BATCH_WAIT_MS:-12}
      PLATE_AI_QUEUE_SIZE: ${PLATE_AI_QUEUE_SIZE:-256}
    command:
      - python
      - plate_http_service.py
      - --host
      - 0.0.0.0
      - --port
      - ${PLATE_AI_PORT:-8765}
      - --imgsz
      - ${PLATE_AI_IMGSZ:-640}
      - --threshold
      - ${PLATE_AI_THRESHOLD:-0.45}
      - --min-box-area
      - ${PLATE_AI_MIN_BOX_AREA:-300}
      - --batch-size
      - ${PLATE_AI_BATCH_SIZE:-8}
      - --batch-wait-ms
      - ${PLATE_AI_BATCH_WAIT_MS:-12}
      - --queue-size
      - ${PLATE_AI_QUEUE_SIZE:-256}
    expose:
      - "${PLATE_AI_PORT:-8765}"
    volumes:
      - plate_ai_output:/app/io/output
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; from urllib.request import urlopen; port = os.environ.get('PLATE_AI_PORT', '8765'); urlopen(f'http://127.0.0.1:{port}/health', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - django_static:/var/www/static:ro
      - django_media:/var/www/media:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/nginx/html/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  mysql_data:
  django_static:
  django_media:
  plate_ai_output:
