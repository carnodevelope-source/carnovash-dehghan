# Docker's default json-file driver keeps every line forever; on a long-lived
# host that quietly fills the disk and drags the whole machine down.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
    max-file: ${DOCKER_LOG_MAX_FILE:-3}

services:
  db:
    image: ${MYSQL_IMAGE:-docker.arvancloud.ir/mysql:8.4}
    logging: *default-logging
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-carwash}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
      MYSQL_ROOT_HOST: "%"
      DB_NAME: ${DB_NAME:-carwash}
      DB_USER: ${DB_USER:-carwash}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      TZ: ${TZ:-Asia/Tehran}
    volumes:
      - ./docker-data/mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped

  redis:
    image: ${REDIS_IMAGE:-docker.arvancloud.ir/redis:7-alpine}
    logging: *default-logging
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - allkeys-lru
    environment:
      TZ: ${TZ:-Asia/Tehran}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${BACKEND_PYTHON_IMAGE:-docker.arvancloud.ir/python:3.12-slim}
    logging: *default-logging
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-replace-me}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1}
      DJANGO_USE_X_FORWARDED_HOST: ${DJANGO_USE_X_FORWARDED_HOST:-True}
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-False}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-False}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DB_NAME: ${DB_NAME:-carwash}
      DB_USER: ${DB_USER:-carwash}
      DB_PASSWORD: ${DB_PASSWORD:-change-me}
      DB_HOST: db
      DB_PORT: "3306"
      DB_CONN_MAX_AGE: ${DB_CONN_MAX_AGE:-60}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-24}
      LIVE_MAX_SUBSCRIBERS: ${LIVE_MAX_SUBSCRIBERS:-40}
      LIVE_V2_ENABLED: ${LIVE_V2_ENABLED:-false}
      LIVE_REPLAY_ENABLED: ${LIVE_REPLAY_ENABLED:-false}
      LIVE_OUTBOX_ENABLED: ${LIVE_OUTBOX_ENABLED:-false}
      LIVE_REVISION_SAFETY_CHECK: ${LIVE_REVISION_SAFETY_CHECK:-true}
      LIVE_OUTBOX_RETENTION_HOURS: ${LIVE_OUTBOX_RETENTION_HOURS:-72}
      IDEMPOTENCY_ENABLED: ${IDEMPOTENCY_ENABLED:-true}
      IDEMPOTENCY_RETENTION_HOURS: ${IDEMPOTENCY_RETENTION_HOURS:-168}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CARWASH_INTERNAL_SCHEDULER: ${CARWASH_INTERNAL_SCHEDULER:-1}
      PLATE_AI_SERVICE_URL: http://plate-ai:8765
      PLATE_AI_TIMEOUT_SECONDS: ${PLATE_AI_TIMEOUT_SECONDS:-5}
      IRANPAYAMAK_BASE_URL: ${IRANPAYAMAK_BASE_URL:-https://api.iranpayamak.com}
      IRANPAYAMAK_LINE_NUMBER: ${IRANPAYAMAK_LINE_NUMBER:-}
      IRANPAYAMAK_API_KEY: ${IRANPAYAMAK_API_KEY:-}
      SMS_PRICE_PER_SEGMENT: ${SMS_PRICE_PER_SEGMENT:-185}
      SMS_CHARS_PER_SEGMENT: ${SMS_CHARS_PER_SEGMENT:-70}
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_MEDIA_ROOT: /app/media
      TZ: ${TZ:-Asia/Tehran}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"
    volumes:
      - ./docker-data/staticfiles:/app/staticfiles
      - ./docker-data/media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/', timeout=5).read()\""]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  plate-ai:
    build:
      context: .
      dockerfile: ai/Dockerfile
      args:
        PYTHON_IMAGE: ${PLATE_AI_PYTHON_IMAGE:-docker.arvancloud.ir/python:3.12-slim}
    logging: *default-logging
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: ${TZ:-Asia/Tehran}
      PLATE_AI_DEVICE: ${PLATE_AI_DEVICE:-auto}
      PLATE_AI_PORT: ${PLATE_AI_PORT:-8765}
      PLATE_AI_IMGSZ: ${PLATE_AI_IMGSZ:-640}
      PLATE_AI_CPU_THREADS: ${PLATE_AI_CPU_THREADS:-4}
      PLATE_AI_THRESHOLD: ${PLATE_AI_THRESHOLD:-0.30}
      PLATE_AI_MIN_BOX_AREA: ${PLATE_AI_MIN_BOX_AREA:-300}
      PLATE_AI_BATCH_SIZE: ${PLATE_AI_BATCH_SIZE:-8}
      PLATE_AI_BATCH_WAIT_MS: ${PLATE_AI_BATCH_WAIT_MS:-12}
      PLATE_AI_QUEUE_SIZE: ${PLATE_AI_QUEUE_SIZE:-256}
      PLATE_AI_OCR_INTERVAL: ${PLATE_AI_OCR_INTERVAL:-12}
      PLATE_AI_COLOR_INTERVAL: ${PLATE_AI_COLOR_INTERVAL:-18}
      PLATE_AI_WEIGHTS_DIR: /app/weights
    command:
      - python
      - plate_http_service.py
      - --host
      - 0.0.0.0
      - --port
      - ${PLATE_AI_PORT:-8765}
      - --imgsz
      - ${PLATE_AI_IMGSZ:-640}
      - --threshold
      - ${PLATE_AI_THRESHOLD:-0.30}
      - --min-box-area
      - ${PLATE_AI_MIN_BOX_AREA:-300}
      - --batch-size
      - ${PLATE_AI_BATCH_SIZE:-8}
      - --batch-wait-ms
      - ${PLATE_AI_BATCH_WAIT_MS:-12}
      - --queue-size
      - ${PLATE_AI_QUEUE_SIZE:-256}
      - --ocr-interval
      - ${PLATE_AI_OCR_INTERVAL:-12}
      - --color-interval
      - ${PLATE_AI_COLOR_INTERVAL:-18}
    expose:
      - "${PLATE_AI_PORT:-8765}"
    volumes:
      - ./ai/final/weights:/app/weights:ro
      - ./docker-data/plate-ai-output:/app/io/output
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; from urllib.request import urlopen; port = os.environ.get('PLATE_AI_PORT', '8765'); urlopen(f'http://127.0.0.1:{port}/health', timeout=5).read()\""]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-docker.arvancloud.ir/node:20-alpine}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-docker.arvancloud.ir/nginx:1.27-alpine}
        VITE_API_BASE_URL: /api
        VITE_LIVE_REPLAY_ENABLED: ${VITE_LIVE_REPLAY_ENABLED:-false}
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    volumes:
      - ./docker-data/staticfiles:/var/www/static:ro
      - ./docker-data/media:/var/www/media:ro
    healthcheck:
      test: ["CMD-SHELL", "test -s /usr/share/nginx/html/index.html && test -s /usr/share/nginx/html/robots.txt && test -s /usr/share/nginx/html/sitemap.xml && test -s /usr/share/nginx/html/llms.txt && test -s /usr/share/nginx/html/login-hero.mp4"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
