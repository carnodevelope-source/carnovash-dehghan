<div class="flex justify-between items-center mb-6">
<div>

<script>
        // Simple micro-interaction for the bottom sheet entry
        window.addEventListener('DOMContentLoaded', () => {
            const sheet = document.getElementById('intakeSheet');
            setTimeout(() => {
                sheet.classList.add('open');
            }, 100);
        });

        // Numeric plate input restriction and auto-focus
        const plateInputs = document.querySelectorAll('.plate-input');
        plateInputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (input.value.length >= input.maxLength && index < plateInputs.length - 1) {
                    plateInputs[index + 1].focus();
                }
            });
        });
    </script>
