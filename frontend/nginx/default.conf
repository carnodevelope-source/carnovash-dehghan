server {
    listen 80;
    server_name _;
    charset utf-8;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    server_tokens off;

    include /etc/nginx/conf.d/security-headers.conf;

    set $forwarded_proto $scheme;
    if ($http_x_forwarded_proto != "") {
        set $forwarded_proto $http_x_forwarded_proto;
    }

    location = /api/live/events/ {
        proxy_pass http://backend:8000/api/live/events/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        chunked_transfer_encoding off;
        gzip off;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;
    }

    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    location = /robots.txt {
        expires 1h;
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        expires 1h;
        try_files /sitemap.xml =404;
    }

    location = /llms.txt {
        expires 1h;
        try_files /llms.txt =404;
    }

    location ^~ /about/ {
        expires 1h;
        try_files $uri $uri/ /about/index.html =404;
    }

    location ^~ /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|svg|woff2?|ttf|jpg|jpeg|png|webp|avif|mp4|webm)$ {
        access_log off;
        expires 30d;
        try_files $uri =404;
    }

    location = /Google\ Search.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 410;
    }

    location ^~ /Google\ Search_files/ {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 410;
    }

    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /landing {
        return 301 /;
    }

    location = /about {
        return 301 /about/;
    }

    location ~ ^/login(/|$) {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/(hq|manager|support|attendance|panel)(/|$) {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
