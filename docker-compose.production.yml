services:
  frontend:
    ports: []
    expose:
      - "80"

  edge-nginx:
    image: ${EDGE_NGINX_IMAGE:-docker.arvancloud.ir/nginx:1.27-alpine}
    logging:
      driver: json-file
      options:
        max-size: ${DOCKER_LOG_MAX_SIZE:-10m}
        max-file: ${DOCKER_LOG_MAX_FILE:-3}
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:-carnowash.ir}
      SECONDARY_DOMAIN: ${SECONDARY_DOMAIN:-www.carnowash.ir}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/edge-nginx/templates:/etc/nginx/templates:ro
      - ./docker/edge-nginx/start-nginx.sh:/start-nginx.sh:ro
      - ./docker-data/certbot-www:/var/www/certbot
      - ./docker-data/letsencrypt:/etc/letsencrypt
    command: ["/bin/sh", "/start-nginx.sh"]
    restart: unless-stopped

  certbot:
    image: ${CERTBOT_IMAGE:-docker.arvancloud.ir/certbot/certbot:latest}
    profiles: ["ops"]
    volumes:
      - ./docker-data/certbot-www:/var/www/certbot
      - ./docker-data/letsencrypt:/etc/letsencrypt
